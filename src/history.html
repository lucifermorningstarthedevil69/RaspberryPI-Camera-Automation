<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test History</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test History</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-elevated: #2c2c2e;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --border: #38383a;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 24px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #8e8e93 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav {
            display: flex;
            gap: 24px;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition);
            padding: 8px 0;
            position: relative;
        }

        .nav a:hover {
            color: var(--text);
        }

        .nav a.active {
            color: var(--text);
        }

        .nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--primary);
            border-radius: 2px;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
            color: var(--text-secondary);
        }

        .search-container {
            position: relative;
            width: 100%;
            max-width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 36px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background-color: var(--surface-elevated);
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
        }

        .table-container {
            overflow-x: auto;
            margin: 0 -24px;
            padding: 0 24px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-Pass {
            color: var(--success);
            font-weight: 600;
        }

        .status-Fail {
            color: var(--danger);
            font-weight: 600;
        }

        .status-Running {
            color: var(--warning);
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 8px 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn[disabled] {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .btn-view {
            background-color: var(--primary);
            color: #fff;
        }

        .btn-download {
            background-color: var(--surface-elevated);
            color: #fff;
            border: 1px solid var(--border);
        }

        .btn-delete-only {
            background-color: rgba(255, 59, 48, 0.1);
            color: var(--danger);
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .btn-delete-both {
            background-color: var(--danger);
            color: #fff;
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 32px 24px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 48px;
            box-sizing: border-box;
        }

        @media screen and (max-width: 900px) {
            .main-container {
                padding: 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .search-container {
                max-width: 100%;
                margin-top: 16px;
            }
            
            .card-header {
                flex-direction: column;
                align-items: stretch;
            }

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                background: var(--surface-elevated);
                border-radius: var(--radius-md);
                margin-bottom: 20px;
                padding: 12px;
                border: 1px solid var(--border);
            }

            td {
                border: none;
                padding: 10px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
                text-align: right;
            }

            td:not(:last-child) {
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            td:before {
                content: attr(data-label);
                font-size: 11px;
                font-weight: 700;
                color: var(--text-secondary);
                text-transform: uppercase;
                text-align: left;
            }

            td:last-child {
                flex-direction: column;
                align-items: stretch;
                padding-top: 16px;
            }

            .btn-group {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            .btn-group .btn {
                width: 100%;
            }
        }

        /* Custom Modal Styles */
        .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .custom-modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .custom-modal {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 400px;
            padding: 24px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            transform: translateY(20px) scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .custom-modal-overlay.active .custom-modal {
            transform: translateY(0) scale(1);
        }

        .custom-modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .custom-modal-icon {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        .custom-modal-icon.error {
            background-color: rgba(255, 59, 48, 0.1);
            color: var(--danger);
        }

        .custom-modal-icon.info {
            background-color: rgba(0, 122, 255, 0.1);
            color: var(--primary);
        }

        .custom-modal-title {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin: 0;
        }

        .custom-modal-message {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .custom-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .custom-modal-btn {
            padding: 10px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .custom-modal-btn.primary {
            background-color: var(--primary);
            color: white;
        }

        .custom-modal-btn.primary:hover {
            background-color: #0056b3;
        }
        
        .custom-modal-btn.danger {
            background-color: var(--danger);
            color: white;
        }

        .custom-modal-btn.danger:hover {
            background-color: #ff453a;
        }

        .custom-modal-btn.cancel {
            background-color: var(--surface-elevated);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .custom-modal-btn.cancel:hover {
            background-color: #3a3a3c;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <h1>Automated Terminal Test Apparatus</h1>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/history" class="active">Test History</a>
                <a href="/system-info">System Info</a>
            </nav>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Recorded Test Logs</h2>
                <div class="search-container">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="log-search" class="search-input" placeholder="Search by Sample/IS Code...">
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Time & Date</th>
                            <th>Sample / IS Code</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="log-table-body">
                        <!-- Log rows will be inserted here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <footer class="footer">
    Automated Terminal Test Apparatus © 2026
    </footer>

    <!-- Custom Modal -->
    <div class="custom-modal-overlay" id="custom-modal-overlay">
        <div class="custom-modal">
            <div class="custom-modal-header">
                <div class="custom-modal-icon error" id="custom-modal-icon">?</div>
                <h3 class="custom-modal-title" id="custom-modal-title">Alert</h3>
            </div>
            <div class="custom-modal-message" id="custom-modal-message"></div>
            <div class="custom-modal-actions" id="custom-modal-actions">
                <button class="custom-modal-btn primary" id="custom-modal-dismiss-btn">Dismiss</button>
            </div>
        </div>
    </div>

    <script>
        function showCustomAlert(title, message, isError = true) {
            const overlay = document.getElementById('custom-modal-overlay');
            const icon = document.getElementById('custom-modal-icon');
            const actions = document.getElementById('custom-modal-actions');
            
            document.getElementById('custom-modal-title').textContent = title;
            document.getElementById('custom-modal-message').textContent = message;
            
            icon.className = 'custom-modal-icon ' + (isError ? 'error' : 'info');
            icon.textContent = isError ? '!' : 'i';
            
            actions.innerHTML = `<button class="custom-modal-btn primary" id="custom-modal-dismiss-btn">Dismiss</button>`;
            
            document.getElementById('custom-modal-dismiss-btn').onclick = () => {
                overlay.classList.remove('active');
            };
            
            overlay.classList.add('active');
        }

        function showCustomConfirm(title, message, isDanger = true) {
            return new Promise((resolve) => {
                const overlay = document.getElementById('custom-modal-overlay');
                const icon = document.getElementById('custom-modal-icon');
                const actions = document.getElementById('custom-modal-actions');
                
                document.getElementById('custom-modal-title').textContent = title;
                document.getElementById('custom-modal-message').textContent = message;
                
                icon.className = 'custom-modal-icon ' + (isDanger ? 'error' : 'info');
                icon.innerHTML = isDanger ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>' : 'i';
                
                actions.innerHTML = `
                    <button class="custom-modal-btn cancel" id="custom-modal-cancel">Cancel</button>
                    <button class="custom-modal-btn ${isDanger ? 'danger' : 'primary'}" id="custom-modal-confirm">Confirm</button>
                `;
                
                overlay.classList.add('active');
                
                document.getElementById('custom-modal-cancel').onclick = () => {
                    overlay.classList.remove('active');
                    resolve(false);
                };
                
                document.getElementById('custom-modal-confirm').onclick = () => {
                    overlay.classList.remove('active');
                    resolve(true);
                };
            });
        }

        let allLogs = [];

        document.addEventListener('DOMContentLoaded', () => {
            fetchLogs();
            
            const searchInput = document.getElementById('log-search');
            if (searchInput) {
                searchInput.addEventListener('input', filterAndRenderLogs);
            }
        });

        const logTableBody = document.getElementById('log-table-body');

        async function fetchLogs() {
            try {
                const response = await fetch('/api/test/logs');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                allLogs = await response.json();
                filterAndRenderLogs();
            } catch (error) {
                console.error("Failed to fetch logs:", error);
                logTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">Error loading logs.</td></tr>`;
            }
        }

        function filterAndRenderLogs() {
            const query = (document.getElementById('log-search')?.value || '').toLowerCase();
            const filteredLogs = allLogs.filter(log => {
                const sampleCode = (log.sample_code || '').toLowerCase();
                const isCode = (log.is_code || '').toLowerCase();
                return sampleCode.includes(query) || isCode.includes(query);
            });
            renderLogs(filteredLogs);
        }

        function formatLogTime(isoString) {
            if (!isoString) return 'N/A';
            try {
                const d = new Date(isoString);
                const year = d.getFullYear();
                const month = (d.getMonth() + 1).toString().padStart(2, '0');
                const day = d.getDate().toString().padStart(2, '0');
                const hours = d.getHours().toString().padStart(2, '0');
                const minutes = d.getMinutes().toString().padStart(2, '0');
                const seconds = d.getSeconds().toString().padStart(2, '0');
                return `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            } catch (e) {
                console.error("Could not format date:", isoString, e);
                return isoString; // Fallback to original string
            }
        }

        function formatDuration(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00:00";
            const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
            const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        function getVideoFilename(log) {
            if (log.video_filename) return log.video_filename;
            if (log.video_path) {
                const parts = log.video_path.split('/');
                return parts[parts.length - 1];
            }
            return null;
        }

        const icons = {
            view: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>`,
            download: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>`,
            trash: `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
        };

        function renderLogs(logs) {
            logTableBody.innerHTML = '';

            if (!logs || logs.length === 0) {
                logTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding: 48px; color: var(--text-secondary);">No test logs found.</td></tr>`;
                return;
            }
            
            // Group logs by sample_code
            const groups = {};
            logs.forEach(log => {
                const sc = log.sample_code || 'Unknown';
                if (!groups[sc]) groups[sc] = [];
                groups[sc].push(log);
            });

            for (const [sampleCode, groupLogs] of Object.entries(groups)) {
                // Determine if we should show a group header
                if (groupLogs.length > 1) {
                    const headerRow = document.createElement('tr');
                    headerRow.style.backgroundColor = 'rgba(0, 122, 255, 0.05)';
                    headerRow.innerHTML = `
                        <td colspan="3" style="font-weight: bold; color: var(--text);">
                            Sample Group: ${sampleCode} <span style="color: var(--text-secondary); font-size: 13px;">(${groupLogs.length} Tests)</span>
                        </td>
                        <td data-label="Actions">
                            <div class="btn-group">
                                <button class="btn btn-download btn-combine-summary" data-code="${sampleCode}">
                                    ${icons.download} Summary PDF
                                </button>
                                <button class="btn btn-download btn-combine-detailed" data-code="${sampleCode}">
                                    ${icons.download} Detailed PDF
                                </button>
                            </div>
                        </td>
                    `;
                    logTableBody.appendChild(headerRow);
                }

                groupLogs.forEach((log, index) => {
                    const time = formatLogTime(log.time);
                    const videoFilename = getVideoFilename(log);
                    const isVideoAvailable = videoFilename !== null;
                    const testNum = groupLogs.length > 1 ? ` <span style="color: var(--primary); font-size: 11px; font-weight: bold;">(Test #${index + 1})</span>` : '';

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td data-label="Time & Date">${time}</td>
                        <td data-label="Sample / IS Code">
                            ${log.sample_code || 'N/A'}${testNum}
                            <div style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;" title="IS Code">${log.is_code || 'N/A'}</div>
                        </td>
                        <td data-label="Status"><span class="status-${log.status}">${log.status || 'Unknown'}</span></td>
                        <td data-label="Actions">
                            <div class="btn-group">
                                <button class="btn btn-view" data-filename="${videoFilename}" ${!isVideoAvailable ? 'disabled' : ''}>
                                    ${icons.view} View
                                </button>
                                <button class="btn btn-download btn-download-log" data-id="${log.id}">
                                    ${icons.download} Report
                                </button>
                                <button class="btn btn-download btn-download-video" data-id="${log.id}" ${!isVideoAvailable ? 'disabled' : ''}>
                                    ${icons.download} Video
                                </button>
                                <button class="btn btn-delete-only" data-id="${log.id}" ${!isVideoAvailable ? 'disabled' : ''}>
                                    ${icons.trash} Del Video
                                </button>
                                <button class="btn btn-delete-both" data-id="${log.id}">
                                    ${icons.trash} Del Both
                                </button>
                            </div>
                        </td>
                    `;
                    logTableBody.appendChild(row);
                });
            }
        }

        logTableBody.addEventListener('click', async (event) => {
            const target = event.target.closest('button');
            if (!target) return;

            const logId = target.dataset.id;
            const sampleCode = target.dataset.code;
            const filename = target.dataset.filename;

            if (target.classList.contains('btn-delete-both')) {
                const confirmed = await showCustomConfirm('Delete Record', 'Are you sure you want to delete this record and its associated video?');
                if (confirmed) {
                    await deleteLog(logId);
                }
            } else if (target.classList.contains('btn-delete-only')) {
                const confirmed = await showCustomConfirm('Delete Video', 'Are you sure you want to delete only the video for this record?');
                if (confirmed) {
                    await deleteVideoFile(logId);
                }
            } else if (target.classList.contains('btn-download-log')) {
                if (logId) downloadLog(logId);
            } else if (target.classList.contains('btn-download-video')) {
                if (logId) downloadVideo(logId);
            } else if (target.classList.contains('btn-view')) {
                if (filename && filename !== 'null') {
                    viewVideo(filename);
                }
            } else if (target.classList.contains('btn-combine-summary')) {
                if (sampleCode) window.location.href = `/api/test/logs/download_combined/${encodeURIComponent(sampleCode)}?type=summary`;
            } else if (target.classList.contains('btn-combine-detailed')) {
                if (sampleCode) window.location.href = `/api/test/logs/download_combined/${encodeURIComponent(sampleCode)}?type=detailed`;
            }
        });


        async function deleteLog(logId) {
            try {
                const response = await fetch(`/api/test/logs/log/${logId}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchLogs(); // Refresh list
                } else {
                    const err = await response.json();
                    showCustomAlert("Error", `Failed to delete log: ${err.status}`, true);
                }
            } catch (error) {
                console.error("Error deleting log:", error);
                showCustomAlert("Error", "An error occurred while deleting the log.", true);
            }
        }

        async function deleteVideoFile(logId) {
            try {
                const response = await fetch(`/api/test/logs/video/${logId}`, { method: 'DELETE' });
                if (response.ok) {
                    fetchLogs(); // Refresh list
                } else {
                    const err = await response.json();
                    showCustomAlert("Error", `Failed to delete video: ${err.status}`, true);
                }
            } catch (error) {
                console.error("Error deleting video:", error);
                showCustomAlert("Error", "An error occurred while deleting the video.", true);
            }
        }



        function downloadLog(logId) {
            window.location.href = `/api/test/logs/download/${logId}`;
        }

        function downloadVideo(logId) {
            window.location.href = `/api/test/logs/video/${logId}`;
        }

        function downloadAllLogs() {
            window.location.href = '/api/test/logs/download';
        }

        function viewVideo(filename) {
            window.open(`/play/${filename}`, '_blank');
        }
    </script>
</body>
</html>
