<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Damage to Conductor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #007aff;
            --success: #34c759;
            --danger: #ff3b30;
            --warning: #ff9500;
            --bg: #000000;
            --surface: #1c1c1e;
            --surface-elevated: #2c2c2e;
            --text: #ffffff;
            --text-secondary: #8e8e93;
            --border: #38383a;
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            padding: 24px;
            box-sizing: border-box;
            flex-grow: 1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fff 0%, #8e8e93 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav {
            display: flex;
            gap: 24px;
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            transition: var(--transition);
            padding: 8px 0;
            position: relative;
        }

        .nav a:hover {
            color: var(--text);
        }

        .nav a.active {
            color: var(--text);
        }

        .nav a.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background-color: var(--primary);
            border-radius: 2px;
        }

        .content {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            align-items: start;
        }

        .card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 24px;
            color: var(--text-secondary);
            letter-spacing: -0.02em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background-color: var(--surface-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
            color: var(--text);
            font-size: 16px;
            font-family: inherit;
            box-sizing: border-box;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .input-row .label-fixed {
            min-width: 60px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-row .unit-fixed {
            min-width: 30px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .timer-input-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .timer-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .timer-unit input {
            width: 100%;
            text-align: center;
        }

        .timer-unit span {
            font-size: 11px;
            font-size: 10px;
            color: var(--text-secondary);
            font-weight: 700;
            text-transform: uppercase;
        }

        .timer-display {
            font-family: 'Outfit', sans-serif;
            font-size: 64px;
            font-weight: 700;
            color: var(--success);
            text-align: center;
            margin: 24px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 14px 20px;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-start {
            background-color: var(--success);
            color: #000;
        }

        .btn-start:hover:not([disabled]) {
            background-color: #3ee669;
            box-shadow: 0 0 20px rgba(52, 199, 89, 0.3);
        }

        .btn-stop {
            background-color: var(--danger);
            color: #fff;
        }

        .btn-stop:hover:not([disabled]) {
            background-color: #ff453a;
            box-shadow: 0 0 20px rgba(255, 59, 48, 0.3);
        }

        .btn-reset {
            background-color: var(--surface-elevated);
            color: #fff;
            border: 1px solid var(--border);
        }

        .btn-reset:hover:not([disabled]) {
            background-color: #3a3a3c;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 6px 12px;
            background-color: var(--surface-elevated);
            border-radius: 100px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .status-badge .dot {
            width: 8px;
            height: 8px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-running .dot {
            background-color: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .video-container {
            background-color: #000;
            border-radius: var(--radius-lg);
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        .video-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .recording-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            background-color: rgba(255, 59, 48, 0.9);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .recording-indicator::before {
            content: '';
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .footer {
            width: 100%;
            text-align: center;
            padding: 32px 24px;
            font-size: 13px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            margin-top: 48px;
            box-sizing: border-box;
        }

        /* Responsive Styles */
        @media screen and (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        @media screen and (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .timer-display {
                font-size: 48px;
            }
        }

        @media screen and (max-width: 480px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }

            .nav {
                width: 100%;
                justify-content: space-between;
                gap: 12px;
            }

            .nav a {
                font-size: 14px;
            }

            .main-container {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <h1>Automated Terminal Test Apparatus</h1>
            <nav class="nav">
                <a href="/" class="active">Home</a>
                <a href="/history">Test History</a>
                <a href="/system-info">System Info</a>
            </nav>
        </div>

        <div class="content">
            <div class="card">
                <h2>Test Configuration</h2>

                <div class="form-group">
                    <label>Sample Details</label>
                    <input type="text" id="sample-code" value="26EABC000" placeholder="Sample Code">
                    <select id="sample-type" style="margin-top: 8px;">
                        <option value="Switches For Domestic And Similar Purposes">Switches For Domestic Purposes</option>
                        <option value="Plugs and Socket-Outlets for Household and Similar Purposes">Plugs and Socket-Outlets for Household</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Standard (IS Code)</label>
                    <select id="is-code">
                        <option value="3854:2023">3854:2023</option>
                        <option value="1293:2019">1293:2019</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Rating (A)</label>
                        <input type="text" id="rating" placeholder="10">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Height (mm)</label>
                        <input type="text" id="height" placeholder="270">
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Weight (g)</label>
                        <input type="text" id="weight" placeholder="400">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Cross-Sectional Area (sq.mm)</label>
                        <select id="area">
                            <option value="0.5">0.5</option>
                            <option value="0.75">0.75</option>
                            <option value="1.0">1.0</option>
                            <option value="1.5">1.5</option>
                            <option value="2.5">2.5</option>
                            <option value="4.0">4.0</option>
                            <option value="6.0">6.0</option>
                            <option value="10.0">10.0</option>
                            <option value="16.0">16.0</option>
                            <option value="25.0">25.0</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 0;">
                        <label>Diameter of Bushing Hole (mm)</label>
                        <input type="text" id="diameter" placeholder="6.5">
                    </div>
                </div>



                <div class="form-group">
                    <label>Test Duration</label>
                    <div class="timer-input-group">
                        <div class="timer-unit">
                            <input type="number" id="hours" value="0" min="0">
                            <span>Hours</span>
                        </div>
                        <div class="timer-unit">
                            <input type="number" id="minutes" value="15" min="0" max="59">
                            <span>Mins</span>
                        </div>
                        <div class="timer-unit">
                            <input type="number" id="seconds" value="00" min="0" max="59">
                            <span>Secs</span>
                        </div>
                    </div>
                </div>

                <div class="timer-display" id="time-left">00:15:00</div>

                <div class="controls-grid">
                    <button id="start-btn" class="btn btn-start">START TEST</button>
                    <button id="reset-btn" class="btn btn-reset">RESET</button>
                </div>
                <button id="stop-btn" class="btn btn-stop" style="width: 100%; margin-bottom: 20px;" disabled>STOP
                    TEST</button>

                <div class="status-badge" id="status-container">
                    <div class="dot"></div>
                    <span id="status">Idle</span>
                </div>
            </div>

            <div class="card video-card">
                <h2>Live Monitoring</h2>
                <div class="video-container">
                    <div class="recording-indicator" style="display: none;">REC</div>
                    <img id="live-feed-img" src="/api/camera/feed" alt="Live Stream">
                </div>
                <div style="display: flex; gap: 12px; align-items: stretch; margin-top: 16px;">
                    <button id="toggle-feed-btn" class="btn btn-reset"
                        style="width: fit-content; padding: 0 20px;">Stop Feed</button>
                    <div class="form-group" style="margin-bottom: 0; min-width: 150px;">
                        <select id="camera-resolution" style="height: 100%;">
                            <option value="1920x1080">1080p (1920x1080)</option>
                            <option value="1280x720" selected>720p (1280x720)</option>
                            <option value="640x480">480p (640x480)</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="footer">
        Automated Terminal Test Apparatus &bull; 2026
    </footer>

    <script>
        const timeLeftDisplay = document.getElementById('time-left');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const resetBtn = document.getElementById('reset-btn');
        const statusDisplay = document.getElementById('status');
        const sampleCodeInput = document.getElementById('sample-code');
        const sampleTypeInput = document.getElementById('sample-type');
        const isCodeInput = document.getElementById('is-code');
        const ratingInput = document.getElementById('rating');
        const heightInput = document.getElementById('height');
        const weightInput = document.getElementById('weight');
        const areaInput = document.getElementById('area');
        const diameterInput = document.getElementById('diameter');
        const cameraResolutionInput = document.getElementById('camera-resolution');
        const hoursInput = document.getElementById('hours');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');
        const recordingIndicator = document.querySelector('.recording-indicator');
        const toggleFeedBtn = document.getElementById('toggle-feed-btn');
        const liveFeedImg = document.getElementById('live-feed-img');

        let timer;
        let statusPoller;
        let currentLogId = null;
        let isFeedRunning = true;

        function formatTime(secs) {
            const hours = Math.floor(secs / 3600).toString().padStart(2, '0');
            const minutes = Math.floor((secs % 3600) / 60).toString().padStart(2, '0');
            const seconds = (secs % 60).toString().padStart(2, '0');
            return `${hours}:${minutes}:${seconds}`;
        }

        function getDurationFromInputs() {
            const hours = parseInt(hoursInput.value, 10) || 0;
            const minutes = parseInt(minutesInput.value, 10) || 0;
            const seconds = parseInt(secondsInput.value, 10) || 0;
            return (hours * 3600) + (minutes * 60) + seconds;
        }

        function startUiUpdate(endTime) {
            clearInterval(timer);

            const updateTimer = () => {
                const now = new Date();
                const remaining = Math.round((endTime - now) / 1000);

                if (remaining >= 0) {
                    timeLeftDisplay.textContent = formatTime(remaining);
                } else {
                    clearInterval(timer);
                }
            };

            updateTimer();
            timer = setInterval(updateTimer, 1000);

            clearInterval(statusPoller);
            statusPoller = setInterval(checkServerState, 2000);

            statusDisplay.textContent = 'Running...';
            recordingIndicator.style.display = 'flex';
            startBtn.disabled = true;
            stopBtn.disabled = false;
            [hoursInput, minutesInput, secondsInput, sampleCodeInput, sampleTypeInput, isCodeInput, ratingInput, heightInput, weightInput, areaInput, diameterInput, cameraResolutionInput, resetBtn, toggleFeedBtn].forEach(el => el.disabled = true);
        }

        async function startTest() {
            if (!isFeedRunning) {
                alert("Please start the camera feed before starting a test.");
                return;
            }
            const duration = getDurationFromInputs();
            if (duration <= 0) return;

            try {
                const appendUnit = (val, unit) => {
                    if (!val) return "";
                    val = val.toString().trim();
                    return val.endsWith(unit) ? val : val + " " + unit;
                };

                const response = await fetch('/api/test/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sample_code: sampleCodeInput.value,
                        sample_type: sampleTypeInput.value,
                        is_code: isCodeInput.value,
                        rating: appendUnit(ratingInput.value, "A"),
                        height: appendUnit(heightInput.value, "mm"),
                        weight: appendUnit(weightInput.value, "g"),
                        area: appendUnit(areaInput.value, "sq.mm"),
                        diameter: appendUnit(diameterInput.value, "mm"),
                        resolution: cameraResolutionInput.value,
                        duration: duration
                    })
                });

                if (response.status === 409) {
                    alert("A test is already in progress.");
                    checkServerState();
                    return;
                }
                const data = await response.json();
                currentLogId = data.log.id;

                // Sync with server time
                const serverNow = new Date(data.server_time);
                const serverStart = new Date(data.log.time);
                const elapsedOnServer = serverNow.getTime() - serverStart.getTime();
                const clientNow = new Date();
                const endTime = new Date(clientNow.getTime() + (duration * 1000 - elapsedOnServer));

                startUiUpdate(endTime);

            } catch (error) {
                console.error("Failed to start test:", error);
                statusDisplay.textContent = 'Error starting test';
            }
        }

        async function stopTest() {
            if (!currentLogId) return;
            try {
                await fetch('/api/test/stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: currentLogId, status: 'Fail' })
                });
                resetUi();
            } catch (error) {
                console.error("Failed to stop test:", error);
                statusDisplay.textContent = 'Error stopping test';
            }
        }

        function resetUi() {
            clearInterval(timer);
            clearInterval(statusPoller);
            const duration = getDurationFromInputs();
            timeLeftDisplay.textContent = formatTime(duration);
            statusDisplay.textContent = 'Idle';
            recordingIndicator.style.display = 'none';
            startBtn.disabled = false;
            stopBtn.disabled = true;
            [hoursInput, minutesInput, secondsInput, sampleCodeInput, sampleTypeInput, isCodeInput, ratingInput, heightInput, weightInput, areaInput, diameterInput, cameraResolutionInput, resetBtn, toggleFeedBtn].forEach(el => el.disabled = false);
            currentLogId = null;
        }

        async function toggleFeed() {
            if (isFeedRunning) {
                try {
                    const response = await fetch('/api/camera/release', { method: 'POST' });
                    if (response.ok) {
                        liveFeedImg.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
                        toggleFeedBtn.textContent = 'Start Feed';
                        isFeedRunning = false;
                    } else {
                        const data = await response.json();
                        alert(data.status || "Could not stop feed.");
                    }
                } catch (error) {
                    console.error("Failed to stop camera feed:", error);
                    alert("An error occurred while trying to stop the feed.");
                }
            } else {
                liveFeedImg.src = '/api/camera/feed?_=' + new Date().getTime();
                toggleFeedBtn.textContent = 'Stop Feed';
                isFeedRunning = true;
            }
        }

        async function checkServerState() {
            try {
                const response = await fetch('/api/test/status');
                const data = await response.json();

                if (data.running) {
                    if (!currentLogId) {
                        currentLogId = data.log.id;
                        const totalDuration = data.log.duration;

                        // Sync with server time
                        const serverNow = new Date(data.server_time);
                        const serverStart = new Date(data.log.time);
                        const elapsedOnServer = serverNow.getTime() - serverStart.getTime();
                        const clientNow = new Date();
                        const endTime = new Date(clientNow.getTime() + (totalDuration * 1000 - elapsedOnServer));

                        sampleCodeInput.value = data.log.sample_code || '';
                        sampleTypeInput.value = data.log.sample_type || '';
                        isCodeInput.value = data.log.is_code || '';
                        ratingInput.value = (data.log.rating || '').replace(/\s*A$/, "");
                        heightInput.value = (data.log.height || '').replace(/\s*mm$/, "");
                        weightInput.value = (data.log.weight || '').replace(/\s*N$/, "").replace(/\s*g$/, "");
                        areaInput.value = (data.log.area || '').replace(/\s*sq\.mm$/, "").replace(/\s*mm²$/, "").replace(/\s*mm\^2$/, "");
                        diameterInput.value = (data.log.diameter || '').replace(/\s*mm$/, "");
                        cameraResolutionInput.value = data.log.resolution || '1280x720';
                        const h = Math.floor(totalDuration / 3600);
                        const m = Math.floor((totalDuration % 3600) / 60);
                        const s = totalDuration % 60;
                        hoursInput.value = h;
                        minutesInput.value = m;
                        secondsInput.value = s;

                        startUiUpdate(endTime);
                    }
                } else {
                    if (currentLogId) {
                        const logResponse = await fetch('/api/test/logs');
                        const logs = await logResponse.json();
                        const finishedLog = logs.find(log => log.id === currentLogId);

                        if (finishedLog && finishedLog.status === 'Fail' && finishedLog.failure_reason === 'Weight Fallen Down!') {
                            alert('Test failed due to Weight Fell Down!');
                        }

                        resetUi();
                    }
                }
            } catch (error) {
                console.error("Failed to check server state:", error);
                statusDisplay.textContent = 'Connection error';
                resetUi();
            }
        }

        // Event Listeners
        startBtn.addEventListener('click', startTest);
        stopBtn.addEventListener('click', stopTest);
        resetBtn.addEventListener('click', resetUi);
        toggleFeedBtn.addEventListener('click', toggleFeed);

        isCodeInput.addEventListener('change', (e) => {
            if (e.target.value === '3854:2023') {
                sampleTypeInput.value = 'Switches For Domestic And Similar Purposes';
            } else if (e.target.value === '1293:2019') {
                sampleTypeInput.value = 'Plugs and Socket-Outlets for Household and Similar Purposes';
            }
        });

        sampleTypeInput.addEventListener('change', (e) => {
            if (e.target.value === 'Switches For Domestic And Similar Purposes') {
                isCodeInput.value = '3854:2023';
            } else if (e.target.value === 'Plugs and Socket-Outlets for Household and Similar Purposes') {
                isCodeInput.value = '1293:2019';
            }
        });

        const conductorData = {
            "0.5": { diameter: "6.5", height: "260", weight: "300" },
            "0.75": { diameter: "6.5", height: "260", weight: "400" },
            "1.0": { diameter: "6.5", height: "260", weight: "400" },
            "1.5": { diameter: "6.5", height: "260", weight: "400" },
            "2.5": { diameter: "9.5", height: "280", weight: "700" },
            "4.0": { diameter: "9.5", height: "280", weight: "900" },
            "6.0": { diameter: "9.5", height: "280", weight: "1400" },
            "10.0": { diameter: "9.5", height: "280", weight: "2000" },
            "16.0": { diameter: "13.0", height: "300", weight: "2900" },
            "25.0": { diameter: "13.0", height: "300", weight: "4500" }
        };

        areaInput.addEventListener('change', (e) => {
            const data = conductorData[e.target.value];
            if (data) {
                diameterInput.value = data.diameter;
                heightInput.value = data.height;
                weightInput.value = data.weight;
            }
        });

        // Initial setup
        document.addEventListener('DOMContentLoaded', () => {
            checkServerState();
            // Ensure UI is synced with default inputs on load if no test is running
            if (!currentLogId) {
                const duration = getDurationFromInputs();
                timeLeftDisplay.textContent = formatTime(duration);
            }
        });

    </script>
</body>
